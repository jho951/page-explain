services:
  explain-page:
    container_name: explain-page-app
    image: ${EXPLAIN_PAGE_IMAGE:?EXPLAIN_PAGE_IMAGE is required}
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${EXPLAIN_PAGE_APP_PORT:-3000}:3000"
    restart: unless-stopped
